{% extends "base.html" %}

{% block title %}Регистрация - {{ super() }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">🔑 Регистрация</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Имя пользователя</label>
                        <input type="text" name="username" class="form-control" required id="id_username">
                    </div>
                    <div class="mb-3">
                        <label for="id_email" class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required id="id_email">
                    </div>
                    <div class="mb-3">
                        <label for="id_password" class="form-label">Пароль</label>
                        <input type="password" name="password" class="form-control" required id="id_password">
                    </div>
                    {% if errors %}
                        <div class="alert alert-danger">
                            <ul class="mb-0">
                            {% for error in errors %}
                                <li>{{ error }}</li>
                            {% endfor %}
                            </ul>
                        </div>
                    {% endif %}
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-success btn-lg">Зарегистрироваться</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center py-3">
                Уже есть аккаунт? <a href="{{ url_for('login') }}">Войдите</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
